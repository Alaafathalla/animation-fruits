<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JELLY GARDEN — soft / lab</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='28'>🍓</text></svg>" />
  <link rel="stylesheet" href="./src/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- Three.js canvas -->
  <canvas id="canvas"></canvas>

  <!-- SVG overlay for slice stroke -->
  <svg id="slice-svg" xmlns="http://www.w3.org/2000/svg"
    style="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5;"></svg>

  <!-- ── Top bar ───────────────────────────────────────────────── -->
  <header class="topbar">
    <div class="topbar-logo">
      <span class="logo-dot"></span>
      <span class="logo-text">soft <span class="logo-slash">/</span> lab</span>
    </div>

    <nav class="category-nav">
      <button class="cat-btn active" data-category="all">
        <span class="cat-dot" style="background:#4caf50"></span> Fruit
      </button>
      <button class="cat-btn" data-category="bloom">
        <span class="cat-dot" style="background:#e91e8c"></span> Bloom
      </button>
      <button class="cat-btn" data-category="citrus">
        <span class="cat-dot" style="background:#cddc39"></span> Citrus
      </button>
      <button class="cat-btn" data-category="melon">
        <span class="cat-dot" style="background:#8bc34a"></span> Melon
      </button>
      <button class="cat-btn" data-category="berry">
        <span class="cat-dot" style="background:#f44336"></span> Berry
      </button>
    </nav>
  </header>

  <!-- ── Headline ───────────────────────────────────────────────── -->
  <div class="headline">
    <h1>JELLY<br/>GARDEN</h1>
  </div>

  <!-- ── Right description ─────────────────────────────────────── -->
  <div class="scene-description">
    <p>A soft study of shape,<br/>wobble and light. Pick one<br/>up, let it go, and watch it<br/>settle.</p>
  </div>

  <!-- ── Knife hint ─────────────────────────────────────────────── -->
  <div class="knife-hint" id="knife-hint">
    KNIFE: Drag across a jelly to slice it
  </div>

  <!-- ── Bottom toolbar ────────────────────────────────────────── -->
  <div class="bottom-toolbar">
    <button class="tb-btn" data-action="hard">Hard</button>
    <button class="tb-btn active" data-action="soft">Soft</button>
    <button class="tb-btn" data-action="knife">Knife</button>
    <button class="tb-btn" data-action="scale">Scale</button>
    <button class="tb-btn" data-action="shake">Shake</button>
    <button class="tb-btn" data-action="reset">Reset</button>
    <button class="tb-btn" data-action="tags">Tags</button>
    <button class="tb-btn" data-action="view">View</button>
  </div>

  <!-- ── Loader ─────────────────────────────────────────────────── -->
  <div id="loader">
    <div class="loader-inner">
      <div class="loader-logo">JELLY GARDEN</div>
      <div class="loader-bar"><div class="loader-fill" id="loader-fill"></div></div>
      <div class="loader-text" id="loader-text">Loading…</div>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
